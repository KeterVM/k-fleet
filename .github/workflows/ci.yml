name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate repository structure
        run: node scripts/validate-repository-structure.mjs
      - name: Lint eval corpus and evidence metadata
        run: node scripts/validate-eval-corpus.mjs
      - name: Test Fleet Ledger example
        working-directory: examples/fleet-ledger
        run: npm test
